<!doctype html>
<html lang="en" data-mood="default">
<head>
<meta charset="utf-8">
<title>Music Player (mini)</title>
<style>
  @import url("/vendor/fonts.css");

  /* ---- same mood palette + fade as homepage.html (driven by data-mood on <html>) ---- */
  @property --bg { syntax: "<color>"; inherits: true; initial-value: #0f1626; }
  @property --s1 { syntax: "<color>"; inherits: true; initial-value: #172036; }
  @property --s2 { syntax: "<color>"; inherits: true; initial-value: #212d4a; }
  @property --line { syntax: "<color>"; inherits: true; initial-value: #30416c; }
  @property --ink { syntax: "<color>"; inherits: true; initial-value: #f4f7ff; }
  @property --mute { syntax: "<color>"; inherits: true; initial-value: #8fa0c4; }
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #3d8bff; }
  @property --accent2 { syntax: "<color>"; inherits: true; initial-value: #8ec5ff; }
  @property --edge { syntax: "<color>"; inherits: true; initial-value: #03060c; }
  @property --glow { syntax: "<color>"; inherits: true; initial-value: #3d8bff; }

  :root, html[data-mood="default"] {
    --bg: #0f1626; --s1: #172036; --s2: #212d4a; --line: #30416c; --ink: #f4f7ff; --mute: #8fa0c4;
    --accent: #3d8bff; --accent2: #8ec5ff; --edge: #03060c; --glow: #3d8bff;
  }
  html[data-mood="romantic"] { --bg:#160c10; --s1:#24141a; --s2:#352028; --line:#5a3542; --ink:#fff4f7; --mute:#c49aaa; --accent:#C75B78; --accent2:#e8a0b4; --edge:#0c0306; --glow:#C75B78; }
  html[data-mood="energetic"] { --bg:#1a0e08; --s1:#28180e; --s2:#3a2414; --line:#6a3c28; --ink:#fff6f0; --mute:#c4a08c; --accent:#FA805A; --accent2:#ffb090; --edge:#0c0603; --glow:#FA805A; }
  html[data-mood="happy"] { --bg:#180c0e; --s1:#261418; --s2:#382028; --line:#5c3440; --ink:#fff4f5; --mute:#c498a0; --accent:#C24E5D; --accent2:#e8909a; --edge:#0c0304; --glow:#C24E5D; }
  html[data-mood="sad"] { --bg:#0c1016; --s1:#141a22; --s2:#1e2834; --line:#3a4a5c; --ink:#eef2f6; --mute:#8a9aab; --accent:#607D9B; --accent2:#9bb0c4; --edge:#03050a; --glow:#607D9B; }
  html[data-mood="relaxed"] { --bg:#0c1410; --s1:#141e18; --s2:#1e2c24; --line:#3a5044; --ink:#f0f6f2; --mute:#8eac9a; --accent:#8FAF9A; --accent2:#b8d0c0; --edge:#030a06; --glow:#8FAF9A; }
  html[data-mood="bittersweet"] { --bg:#120e12; --s1:#1e161c; --s2:#2c222a; --line:#4a3844; --ink:#f6f0f4; --mute:#b098a4; --accent:#9B7184; --accent2:#c4a0b0; --edge:#080508; --glow:#9B7184; }
  html[data-mood="devotional"] { --bg:#101010; --s1:#1a1a1a; --s2:#282828; --line:#484848; --ink:#f4f4f4; --mute:#a8a8a8; --accent:#9E9E9E; --accent2:#c8c8c8; --edge:#060606; --glow:#9E9E9E; }
  html {
    --palette-ease: 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    transition:
      --bg var(--palette-ease), --s1 var(--palette-ease), --s2 var(--palette-ease),
      --line var(--palette-ease), --ink var(--palette-ease), --mute var(--palette-ease),
      --accent var(--palette-ease), --accent2 var(--palette-ease), --edge var(--palette-ease),
      --glow var(--palette-ease);
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Poppins", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  body { padding: 2px 5px 5px 2px; } /* room for the hard offset shadow */

  /* ---- card: same background as the app (bg + soft mood glow), hard shadow, scanlines ---- */
  .mini {
    position: relative; height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 12px;
    background-color: var(--bg);
    background-image: radial-gradient(380px 110px at 50% -46px, color-mix(in srgb, var(--glow) 34%, transparent), transparent 70%);
    background-repeat: no-repeat;
    border: 2px solid var(--edge); border-radius: 16px; box-shadow: 3px 3px 0 var(--edge);
    cursor: grab; touch-action: none;
  }
  .mini.dragging { cursor: grabbing; }
  .mini::after { /* same scanline overlay as the app */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
  }
  .mini::before { /* body highlight strip, like the cassette deck's top edge */
    content: ""; position: absolute; left: 14px; right: 14px; top: 2px; height: 2px; border-radius: 2px;
    background: #fff; opacity: .1; pointer-events: none;
  }

  /* ---- mini cassette (colours follow the mood, like cassette.css) ---- */
  .cd { flex: none; width: 56px; height: 38px; }
  .cd svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .cd.drop { animation: insert .45s cubic-bezier(.2, .8, .3, 1); }
  @keyframes insert { from { transform: translateY(-12px); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
  .cs-mini-body   { fill: color-mix(in srgb, var(--accent2) 55%, #e8eef8); }
  .cs-mini-window { fill: color-mix(in srgb, var(--s1) 75%, #0a1120); }
  .cs-mini-hub { transform-box: fill-box; transform-origin: center;
    animation: spin 1.7s linear infinite reverse; animation-play-state: paused; }
  body.playing .cs-mini-hub { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- text: title, LED + tape strip ---- */
  .text { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .led { flex: none; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--edge);
    background: color-mix(in srgb, var(--s2) 80%, var(--edge)); transition: background .25s, box-shadow .25s; }
  body.playing .led { background: var(--accent2); box-shadow: 0 0 5px var(--accent2); }
  .title { min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title.swap { animation: swap .35s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes swap { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .tape { margin-top: 7px; height: 3px; border-radius: 2px; opacity: .3; transition: opacity .25s;
    background: repeating-linear-gradient(90deg, var(--accent2) 0 3px, transparent 3px 8px); background-size: 8px 3px;
    animation: tape .45s linear infinite; animation-play-state: paused; }
  body.playing .tape { opacity: .75; animation-play-state: running; }
  @keyframes tape { to { background-position-x: 8px; } }

  /* ---- buttons: same look + press/morph animations as the app's dock controls ---- */
  .ctl { display: flex; align-items: center; gap: 8px; flex: none; }
  button { font: inherit; cursor: pointer; position: relative; flex: none; width: 36px; height: 36px; padding: 0;
    display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--edge); background: var(--s1); color: var(--ink);
    transition: transform .2s cubic-bezier(.2, .9, .3, 1.4), opacity .15s ease; }
  button:hover { opacity: .75; }
  button:active { transform: scale(.86); transition-duration: .08s; }
  button:disabled { opacity: .35; pointer-events: none; }
  button svg { width: 20px; height: 20px; fill: currentColor; }
  #play { width: 42px; height: 42px; background: var(--ink); color: #070b14; }
  #play svg { position: absolute; inset: 0; margin: auto; width: 22px; height: 22px;
    transition: opacity .18s ease, transform .32s cubic-bezier(.2, .9, .3, 1.25); }
  #pause-i { opacity: 0; transform: scale(.4) rotate(-45deg); }
  body.playing #pause-i { opacity: 1; transform: none; }
  body.playing #play-i { opacity: 0; transform: scale(.4) rotate(45deg); }
  body.playing #play { box-shadow: inset 0 3px 0 rgba(0,0,0,.22); } /* PLAY key stays pressed, like the deck */
  #restore { width: 28px; height: 28px; background: transparent; border-color: transparent; color: var(--mute); }
  #restore svg { width: 16px; height: 16px; }

  @media (prefers-reduced-motion: reduce) {
    html { --palette-ease: 0s; }
    .cs-mini-hub, .tape, .cd.drop, .title.swap { animation: none; }
  }
</style>
</head>
<body>
<div class="mini">
  <div class="cd" id="cd">
    <svg viewBox="0 0 56 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect class="cs-mini-body" x="1.5" y="1.5" width="53" height="35" rx="6" stroke="#03060c" stroke-width="2"/>
      <rect class="cs-mini-window" x="7" y="8" width="42" height="22" rx="5" stroke="#03060c" stroke-width="1.5"/>
      <circle cx="19" cy="19" r="6.6" fill="#5a4033"/>
      <g transform="translate(19 19)"><g class="cs-mini-hub">
        <circle r="4.6" fill="#f4f7ff" stroke="#03060c" stroke-width=".8"/>
        <path d="M0 -3.2V-1.2M2.8 1.6L1.1 .6M-2.8 1.6L-1.1 .6" stroke="#0a1120" stroke-width="1.3" fill="none"/>
      </g></g>
      <circle cx="37" cy="19" r="6.6" fill="#5a4033"/>
      <g transform="translate(37 19)"><g class="cs-mini-hub">
        <circle r="4.6" fill="#f4f7ff" stroke="#03060c" stroke-width=".8"/>
        <path d="M0 -3.2V-1.2M2.8 1.6L1.1 .6M-2.8 1.6L-1.1 .6" stroke="#0a1120" stroke-width="1.3" fill="none"/>
      </g></g>
    </svg>
  </div>

  <div class="text">
    <div class="row"><span class="led"></span><div class="title" id="title">No song playing</div></div>
    <div class="tape"></div>
  </div>

  <div class="ctl">
    <button id="back" title="Back"><svg viewBox="0 0 24 24"><path d="M17 6v12L7 12l10-6zM7 6v12H5V6h2z"/></svg></button>
    <button id="play" title="Play / Pause">
      <svg id="play-i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pause-i" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <button id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M7 6v12l10-6-10-6zm10 0v12h2V6h-2z"/></svg></button>
    <button id="restore" title="Open Music Player"><svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-6.3 6.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg></button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KNOWN = ['romantic', 'energetic', 'happy', 'sad', 'relaxed', 'bittersweet', 'devotional'];
  var ch = new BroadcastChannel('music-player-mini');
  var root = document.documentElement;
  var titleEl = document.getElementById('title');
  var cdEl = document.getElementById('cd');
  var backBtn = document.getElementById('back');
  var lastName = null;
  var PALETTE_VARS = ['--bg', '--s1', '--s2', '--line', '--ink', '--mute', '--accent', '--accent2', '--edge', '--glow', '--sun-a', '--sun-b', '--sun-c'];
  var wantPlaying = false, playTimer = 0, bypassUntil = 0;

  // Skipping tracks briefly reports "paused" while the next file loads. Showing that would flash
  // the play icon, so a playing -> paused change only shows if it still holds after a moment.
  // (A pause you triggered from the mini-player itself is shown straight away.)
  function settlePlaying() {
    clearTimeout(playTimer); playTimer = 0;
    document.body.classList.toggle('playing', wantPlaying);
  }

  function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  function apply(s) {
    if (!s) return;
    var name = s.name || 'No song playing';
    if (name !== lastName) {
      titleEl.textContent = name;
      titleEl.title = name;
      if (lastName !== null && s.name) { replay(titleEl, 'swap'); replay(cdEl, 'drop'); }
      lastName = name;
    }
    wantPlaying = !!s.playing;
    if (wantPlaying || Date.now() < bypassUntil || !document.body.classList.contains('playing')) settlePlaying();
    else if (!playTimer) playTimer = setTimeout(settlePlaying, 400);
    backBtn.disabled = !s.canBack;
    var mood = (s.mood || '').toString().toLowerCase();
    root.dataset.mood = KNOWN.indexOf(mood) >= 0 ? mood : 'default';
    // user-customised palette (Settings) overrides the built-in mood colours
    PALETTE_VARS.forEach(function (k) {
      if (s.palette && s.palette[k]) root.style.setProperty(k, s.palette[k]); else root.style.removeProperty(k);
    });
    if (window.miniApi) window.miniApi.hasSong(!!s.hasSong);
  }

  ch.onmessage = function (e) { if (e.data && e.data.type === 'state') apply(e.data.state); };

  function cmd(name) { ch.postMessage({ type: 'cmd', cmd: name }); }
  document.getElementById('back').onclick = function () { cmd('back'); };
  document.getElementById('play').onclick = function () { bypassUntil = Date.now() + 1500; cmd('toggle'); };
  document.getElementById('next').onclick = function () { cmd('next'); };
  document.getElementById('restore').onclick = function () { if (window.miniApi) window.miniApi.restore(); };

  // Drag the card by its background (buttons are excluded so clicks always reach them).
  var card = document.querySelector('.mini');
  var drag = null;
  card.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || e.target.closest('button') || !window.miniApi) return;
    drag = { x: e.screenX, y: e.screenY };
    card.setPointerCapture(e.pointerId);
    card.classList.add('dragging');
    window.miniApi.dragStart();
  });
  card.addEventListener('pointermove', function (e) {
    if (drag) window.miniApi.dragMove(e.screenX - drag.x, e.screenY - drag.y);
  });
  function endDrag() {
    if (!drag) return;
    drag = null;
    card.classList.remove('dragging');
    window.miniApi.dragEnd();
  }
  card.addEventListener('pointerup', endDrag);
  card.addEventListener('pointercancel', endDrag);

  ch.postMessage({ type: 'request-state' });
})();
</script>
</body>
</html>
